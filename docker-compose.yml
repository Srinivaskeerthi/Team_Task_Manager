services:

  mongodb:
    image: mongo:6.0-jammy
    container_name: flowsphere-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flowsphere-app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/flowsphere
      - JWT_SECRET=flowsphere_docker_secret_key_2026
      - JWT_EXPIRE=7d
      - NODE_ENV=production
      - CLIENT_URL=http://localhost:5000
    volumes:
      - uploads-data:/app/server/uploads
    depends_on:
      - mongodb
    restart: unless-stopped

volumes:
  mongo-data:
  uploads-data:
